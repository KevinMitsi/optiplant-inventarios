spring:
  application:
    name: inventories

  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mydatabase?reWriteBatchedInserts=true}
    username: ${DB_USERNAME:myuser}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: inventories-pool
      # (#CPU * 2) + husos de espera. Pool pequeno y acotado: menos memoria y menos contencion.
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 600000        # 10 min sin uso antes de cerrar una conexion ociosa
      max-lifetime: 1800000       # 30 min de vida maxima (por debajo del timeout del servidor)
      connection-timeout: 30000
      leak-detection-threshold: 60000   # avisa si una conexion se retiene mas de 1 min
      auto-commit: false

  jpa:
    open-in-view: false           # RNF-01: sin lazy loading fuera de la capa de aplicacion
    hibernate:
      ddl-auto: validate          # el esquema lo gobierna Flyway, nunca Hibernate
    properties:
      hibernate:
        jdbc:
          batch_size: 30          # RNF-07: agrupa INSERT/UPDATE de items y movimientos
          fetch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        query:
          in_clause_parameter_padding: true
          fail_on_pagination_over_collection_fetch: true   # detecta paginacion en memoria
        connection:
          provider_disables_autocommit: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

  threads:
    virtual:
      enabled: true               # Java 21: un hilo virtual por peticion, sin pool acotado

  mvc:
    problemdetails:
      enabled: true               # RFC 7807 para los errores no capturados por el handler

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never     # RNF-03: nunca filtrar trazas al cliente
  shutdown: graceful

# --- Configuracion propia de la aplicacion ---
inventories:
  security:
    jwt:
      # Clave de firma HMAC en texto. Minimo 32 caracteres: por debajo de 256 bits la firma
      # se vuelve atacable por fuerza bruta y cualquiera podria emitir tokens validos para
      # cualquier usuario y cualquier rol. La aplicacion no arranca si es mas corta.
      #
      # NUNCA usar el valor por defecto fuera de desarrollo local: se inyecta por JWT_SECRET.
      secret: ${JWT_SECRET:desarrollo-local-clave-no-apta-para-produccion-cambiar-por-variable-de-entorno}
      issuer: optiplant-inventories
      access-token-ttl: PT1H
      refresh-token-ttl: P7D
  pagination:
    default-page-size: 20
    max-page-size: 100

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    io.github.KevinMitsi.inventories: ${LOG_LEVEL:INFO}
